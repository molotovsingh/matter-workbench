# .specify/hooks.yml
#
# Git (and other) hooks for the specify workflow.
#
# Each hook is a named list of shell commands that scripts run at specific
# points in the workflow. To disable a hook entirely, remove its commands
# or comment them out. To add extra steps (e.g. push, notify), append more
# commands under the relevant hook.
#
# Template variables: use {{variable_name}} in any command string and the
# corresponding key=value argument passed by the script will be substituted.

hooks:
  # Fetch all remotes so that branch listings are up-to-date before
  # auto-numbering a new feature branch.
  #
  # LOCAL CHANGE: output is discarded. check_existing_branches in
  # create-new-feature.sh runs this hook inside the command substitution that
  # produces BRANCH_NUMBER, and `git fetch --all` prints "Fetching <remote>" to
  # stdout — not stderr, which the script does redirect. Those lines end up in
  # the branch number and the script dies on `10#Fetching: value too great for
  # base`. Any repo with a configured remote hits this.
  #
  # Nothing parses this hook's output; only list_branches is read. Silencing it
  # is therefore safe, and keeps the fix in configuration rather than patching
  # the vendored script.
  fetch_remotes:
    - git fetch --all --prune >/dev/null 2>&1

  # List branches for auto-numbering. The output of this hook is captured
  # and parsed; each line should be one branch name (git branch -a format).
  #
  # LOCAL CHANGE: strips the `feature/` prefix so this repo's branches are
  # visible to the numbering scan, which matches ^[0-9]{3}- against each line.
  #
  # This matters more than it looks under a worktree workflow. Auto-numbering
  # draws from two sources: specs/ directories and branch names. specs/ lives
  # inside the tree, so it is per-worktree — two features specced in parallel
  # worktrees cannot see each other and both come out numbered 001. Branches
  # are repo-global, shared across every worktree through one ref database, so
  # counting them is what makes numbering correct here.
  #
  # The `+ ` marker is stripped for the same reason. git marks branches checked
  # out in ANOTHER worktree with `+`, and the downstream cleaner in
  # create-new-feature.sh only strips `*` and spaces. Under this workflow every
  # active feature branch is checked out in its own worktree, so `+` is the
  # common case, not the rare one — left unstripped it hides precisely the
  # branches the counter exists to find.
  #
  # The current branch is excluded. Under this repo's workflow the feature
  # branch is created BY HAND before speckit runs, so it already exists when
  # the counter looks — counting it makes the script allocate the next number
  # and every feature lands with a spec directory one ahead of its branch.
  # Excluding only the current branch keeps other worktrees' branches visible,
  # which is the collision this hook exists to prevent.
  list_branches:
    - git branch -a | sed 's|^[+*] ||; s|feature/||' | grep -vx "$(git rev-parse --abbrev-ref HEAD | sed 's|^feature/||')"

  # Create the feature branch after a new feature is initialised.
  # {{branch_name}} is replaced with the computed branch name, e.g. 003-user-auth.
  #
  # DISABLED for this repository — deliberately, not by accident.
  #
  # `git checkout -b` moves whichever worktree invoked it onto the new branch.
  # This repo runs six worktrees with main permanently checked out in
  # matter-workbench/, and scripts/private-vm-rsync-deploy.mjs rsyncs
  # `git ls-files` from its working directory. A silently moved worktree would
  # therefore ship feature code to the beta VM under a maintenance-checkpoint
  # label — a release-record lie, which docs/release-policy.md exists to prevent.
  #
  # Branch by making the worktree first, then run speckit inside it:
  #   git worktree add ../matter-workbench-<name> -b feature/<name>
  #   cd ../matter-workbench-<name>
  # create-new-feature.sh resolves specs against the invoking worktree, so the
  # spec lands beside the branch automatically.
  #
  # An undefined create_branch hook is a supported mode, not a workaround:
  # create-new-feature.sh warns and continues.
  #
  # create_branch:
  #   - git checkout -b "{{branch_name}}"

  # Get current feature identifier from VCS.
  # This hook determines what identifies the current feature being worked on.
  # For git, this is the branch name. For other systems, it could be a feature ID from a manifest.
  # Output: feature identifier string (e.g., "001-user-auth", "feat-auth", etc.)
  #
  # LOCAL CHANGE: this repo prefixes branches `feature/<name>` across all its
  # worktrees, while speckit requires the feature identifier to match ^[0-9]{3}-
  # (see check_feature_branch in scripts/bash/common.sh). Stripping the prefix
  # here satisfies both conventions at once, so `feature/001-postgres-bridge`
  # resolves to feature id `001-postgres-bridge`.
  #
  # The alternative was exporting SPECIFY_FEATURE per shell. Rejected: it is
  # ambient state that must be re-established in every new session, and a later
  # session that does not know to set it resolves to the wrong feature silently.
  # The branch name should carry the identity on its own.
  get_current_feature:
    - |
      if [[ -n "${SPECIFY_FEATURE:-}" ]]; then
        echo "$SPECIFY_FEATURE"
      else
        git rev-parse --abbrev-ref HEAD | sed 's|^feature/||'
      fi

  # Verify VCS is initialized and ready.
  # Returns: exit code 0 on success, 1 on failure.
  # Stdout is ignored; used only for success/failure validation.
  verify_vcs_ready:
    - git rev-parse --show-toplevel >/dev/null 2>&1

  # Format a feature identifier from components.
  # {{feature_num}} = numeric ID (e.g., "003")
  # {{short_name}} = feature short name (e.g., "user-auth")
  # Output: formatted feature identifier suitable for branch and directory names
  format_feature_id:
    - echo "{{feature_num}}-{{short_name}}"

  # Get feature directory path for a feature.
  # {{repo_root}} = repository root
  # {{feature_id}} = feature identifier (e.g., "003-user-auth")
  # Output: absolute path to feature directory in specs/
  get_feature_dir:
    - echo "{{repo_root}}/specs/{{feature_id}}"
